publicHoistPattern:
  - '*@heroui/*'

enablePrePostScripts: true

overrides:
  immutable: '>=5.1.5'
  hono: '>=4.12.21'
  '@hono/node-server': '>=1.19.13'
  effect: '>=3.20.0'
  'eslint>ajv': '6.14.0'
  '@eslint/eslintrc>ajv': '6.14.0'
  'table>ajv': '8.18.0'
  fast-uri: '>=3.1.2'
  fast-xml-parser: '>=5.7.0'
  postcss: '>=8.5.10'
  fast-xml-builder: '>=1.1.7'
  '@rvf/set-get': '>=7.0.2'
  jws: '3.2.3'
  dompurify: '>=3.4.3'
  tar: '>=7.5.8'
  defu: '>=6.1.5'
  mdast-util-to-hast: '>=13.2.1'
  yaml: '>=2.8.3'
  lodash: '4.18.1'
  lodash-es: '4.18.1'
  'eslint>minimatch': '3.1.5'
  'eslint-plugin-import>minimatch': '3.1.5'
  'eslint-plugin-jsx-a11y>minimatch': '3.1.5'
  'eslint-plugin-react>minimatch': '3.1.5'
  '@typescript-eslint/typescript-estree>minimatch': '9.0.9'
  'minimatch>brace-expansion': '1.1.14'

allowBuilds:
  '@heroui/shared-utils': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  bcrypt: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  cap-widget@0.1.56: patches/cap-widget@0.1.56.patch
